# Place this file at: .github/workflows/metrics.yml
#
# Generates ./github-metrics.svg (stats, top languages, activity, repositories)
# and commits it straight to the repo. Because the SVG is a static file that
# lives in your repo, it always renders — it never depends on a live
# third-party server or a shared rate limit at page-view time.
#
# Setup:
#  1. Settings → Secrets and variables → Actions → New repository secret
#     Name: METRICS_TOKEN
#     Value: a Personal Access Token (classic) with the "repo" and
#            "read:user" scopes — https://github.com/settings/tokens
#  2. Actions tab → "Generate GitHub Metrics" → Run workflow (to generate
#     the first version immediately instead of waiting for the schedule).
#
# Docs / all available options: https://github.com/lowlighter/metrics

name: Generate GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shakilkhan496
          filename: github-metrics.svg

          # Sections
          template: classic
          base: header, activity, community, repositories, metadata

          # Top languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: bytes-size, percentage

          # Lines of code changed
          plugin_lines: yes

          # Coding activity heatmap (streak-style habits chart)
          plugin_habits: yes
          plugin_habits_charts_type: bars

          config_timezone: Asia/Dhaka
